<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>

  <!-- Title -->
  <text x="200" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Probability Distribution</text>

  <!-- Axes -->
  <line x1="50" y1="250" x2="370" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <line x1="50" y1="250" x2="50" y2="50" stroke="#94a3b8" stroke-width="2"/>

  <!-- Bell curve -->
  <path d="M 50 250 Q 100 250 130 230 Q 160 200 190 120 Q 210 60 230 120 Q 260 200 290 230 Q 320 250 370 250"
        fill="url(#grad1)" fill-opacity="0.3" stroke="url(#grad1)" stroke-width="3"/>

  <!-- Grid lines -->
  <line x1="50" y1="200" x2="370" y2="200" stroke="#e2e8f0" stroke-dasharray="5,5"/>
  <line x1="50" y1="150" x2="370" y2="150" stroke="#e2e8f0" stroke-dasharray="5,5"/>
  <line x1="50" y1="100" x2="370" y2="100" stroke="#e2e8f0" stroke-dasharray="5,5"/>

  <!-- Axis labels -->
  <text x="200" y="275" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">Value</text>
  <text x="25" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b" transform="rotate(-90, 25, 150)">Probability</text>

  <!-- Mean indicator -->
  <line x1="210" y1="250" x2="210" y2="60" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="210" y="45" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ef4444">μ (mean)</text>

  <!-- Standard deviation markers -->
  <line x1="130" y1="250" x2="130" y2="230" stroke="#10b981" stroke-width="2"/>
  <line x1="290" y1="250" x2="290" y2="230" stroke="#10b981" stroke-width="2"/>
  <text x="130" y="265" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#10b981">-σ</text>
  <text x="290" y="265" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#10b981">+σ</text>
</svg>
