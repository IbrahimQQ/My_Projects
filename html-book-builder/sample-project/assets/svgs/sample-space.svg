<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  <rect x="40" y="40" width="320" height="220" fill="url(#grid)"/>

  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Sample Space (S)</text>

  <!-- Sample space rectangle -->
  <rect x="40" y="40" width="320" height="220" fill="none" stroke="#1e293b" stroke-width="2"/>
  <text x="55" y="58" font-family="sans-serif" font-size="12" fill="#1e293b">S</text>

  <!-- Event A (circle) -->
  <circle cx="150" cy="150" r="70" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="2"/>
  <text x="150" y="155" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8">A</text>

  <!-- Event B (circle) -->
  <circle cx="250" cy="150" r="70" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="2"/>
  <text x="280" y="155" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#059669">B</text>

  <!-- Intersection highlight -->
  <clipPath id="clipA">
    <circle cx="150" cy="150" r="70"/>
  </clipPath>
  <circle cx="250" cy="150" r="70" fill="#8b5cf6" fill-opacity="0.5" clip-path="url(#clipA)"/>

  <!-- A ∩ B label -->
  <text x="200" y="155" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#6d28d9">A∩B</text>

  <!-- Legend -->
  <rect x="50" y="270" width="15" height="15" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6"/>
  <text x="70" y="282" font-family="sans-serif" font-size="11" fill="#64748b">Event A</text>

  <rect x="140" y="270" width="15" height="15" fill="#10b981" fill-opacity="0.3" stroke="#10b981"/>
  <text x="160" y="282" font-family="sans-serif" font-size="11" fill="#64748b">Event B</text>

  <rect x="230" y="270" width="15" height="15" fill="#8b5cf6" fill-opacity="0.5" stroke="#8b5cf6"/>
  <text x="250" y="282" font-family="sans-serif" font-size="11" fill="#64748b">A ∩ B (Intersection)</text>

  <!-- Probability notation -->
  <text x="200" y="295" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">P(A ∪ B) = P(A) + P(B) - P(A ∩ B)</text>
</svg>
