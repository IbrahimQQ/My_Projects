<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5cb85c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449d44;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)"/>

  <!-- Book Shape -->
  <g transform="translate(256, 256)">
    <!-- Left page -->
    <path d="M-20 -100 L-120 -80 L-120 100 L-20 80 Z" fill="white" opacity="0.95"/>
    <!-- Right page -->
    <path d="M20 -100 L120 -80 L120 100 L20 80 Z" fill="white" opacity="0.95"/>
    <!-- Center binding -->
    <path d="M-20 -100 L0 -110 L20 -100 L20 80 L0 90 L-20 80 Z" fill="#e0e0e0"/>

    <!-- Text lines on left page -->
    <rect x="-100" y="-60" width="60" height="6" rx="3" fill="#ccc"/>
    <rect x="-100" y="-40" width="50" height="6" rx="3" fill="#ccc"/>
    <rect x="-100" y="-20" width="55" height="6" rx="3" fill="#ccc"/>
    <rect x="-100" y="0" width="45" height="6" rx="3" fill="#ccc"/>
    <rect x="-100" y="20" width="60" height="6" rx="3" fill="#ccc"/>
    <rect x="-100" y="40" width="40" height="6" rx="3" fill="#ccc"/>

    <!-- Text lines on right page -->
    <rect x="40" y="-60" width="60" height="6" rx="3" fill="#ccc"/>
    <rect x="40" y="-40" width="50" height="6" rx="3" fill="#ccc"/>
    <rect x="40" y="-20" width="55" height="6" rx="3" fill="#ccc"/>
    <rect x="40" y="0" width="45" height="6" rx="3" fill="#ccc"/>
    <rect x="40" y="20" width="60" height="6" rx="3" fill="#ccc"/>
    <rect x="40" y="40" width="40" height="6" rx="3" fill="#ccc"/>
  </g>

  <!-- Globe/Browser icon overlay -->
  <g transform="translate(350, 350)">
    <circle cx="0" cy="0" r="70" fill="url(#grad2)" stroke="white" stroke-width="4"/>
    <ellipse cx="0" cy="0" rx="30" ry="50" fill="none" stroke="white" stroke-width="3"/>
    <line x1="-50" y1="0" x2="50" y2="0" stroke="white" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="none" stroke="white" stroke-width="3"/>
  </g>

  <!-- Graduation cap -->
  <g transform="translate(140, 120)">
    <polygon points="0,30 60,0 120,30 60,60" fill="#333"/>
    <rect x="50" y="30" width="20" height="25" fill="#333"/>
    <circle cx="60" cy="55" r="8" fill="#ffc107"/>
    <line x1="60" y1="63" x2="60" y2="85" stroke="#ffc107" stroke-width="3"/>
    <circle cx="60" cy="90" r="6" fill="#ffc107"/>
  </g>
</svg>
