<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://api.dictionaryapi.dev; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
    <title>Dictionary</title>
    <link rel="stylesheet" href="../styles/main.css">
    <style>
        body {
            overflow: hidden;
            user-select: none;
        }

        .dictionary-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--bg-primary);
        }

        .dictionary-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            cursor: move;
            -webkit-app-region: drag;
        }

        .dictionary-header > * {
            -webkit-app-region: no-drag;
        }

        .dictionary-title {
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            -webkit-app-region: drag;
        }

        .window-controls {
            display: flex;
            gap: 4px;
        }

        .dictionary-search {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-input-wrapper {
            display: flex;
            gap: 8px;
        }

        .search-input-wrapper input {
            flex: 1;
        }

        .dictionary-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .word-header {
            margin-bottom: 16px;
        }

        .word-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .word-phonetic {
            font-size: 16px;
            color: var(--text-secondary);
            font-style: italic;
        }

        .pronunciation-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background-color: var(--accent-light);
            color: var(--accent-color);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 8px;
        }

        .pronunciation-btn:hover {
            background-color: var(--accent-color);
            color: white;
        }

        .meaning-section {
            margin-bottom: 20px;
        }

        .part-of-speech {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-color);
            text-transform: uppercase;
            margin-bottom: 10px;
            padding-bottom: 4px;
            border-bottom: 2px solid var(--accent-color);
            display: inline-block;
        }

        .definition-item {
            margin-bottom: 12px;
            padding-left: 16px;
            border-left: 3px solid var(--border-color);
        }

        .definition-text {
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .definition-example {
            font-style: italic;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .synonyms-section, .antonyms-section {
            margin-top: 8px;
        }

        .synonyms-title, .antonyms-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .word-tag {
            display: inline-block;
            padding: 2px 8px;
            background-color: var(--bg-tertiary);
            border-radius: 12px;
            font-size: 12px;
            margin-right: 4px;
            margin-bottom: 4px;
            cursor: pointer;
        }

        .word-tag:hover {
            background-color: var(--accent-light);
            color: var(--accent-color);
        }

        .search-history {
            margin-top: 16px;
        }

        .search-history-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .history-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .error-message {
            text-align: center;
            color: var(--danger-color);
            padding: 20px;
        }

        .opacity-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-secondary);
        }

        .opacity-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            outline: none;
        }

        .opacity-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--accent-color);
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="dictionary-container" id="dictionaryContainer">
        <div class="dictionary-header">
            <div class="dictionary-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--accent-color)">
                    <path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/>
                </svg>
                Dictionary
            </div>
            <div class="window-controls">
                <button class="btn-icon" id="minimizeBtn" title="Minimize">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 19h12v2H6z"/>
                    </svg>
                </button>
                <button class="btn-icon" id="closeBtn" title="Close">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="dictionary-search">
            <div class="search-input-wrapper">
                <input type="text" id="searchInput" placeholder="Enter a word to look up..." autocomplete="off">
                <button class="btn btn-primary" id="searchBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="dictionary-content" id="dictionaryContent">
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/>
                </svg>
                <p>Enter a word to see its definition</p>
                <div class="search-history" id="searchHistory"></div>
            </div>
        </div>

        <div class="opacity-toggle">
            <span>Opacity:</span>
            <input type="range" class="opacity-slider" id="opacitySlider" min="50" max="100" value="100">
            <span id="opacityValue">100%</span>
        </div>
    </div>

    <script>
        let searchHistory = [];
        let audioPlayer = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadSearchHistory();
            setupEventListeners();
        });

        function setupEventListeners() {
            // Search
            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchWord();
            });
            document.getElementById('searchBtn').addEventListener('click', searchWord);

            // Window controls
            document.getElementById('minimizeBtn').addEventListener('click', () => {
                window.electronAPI.tools.minimizeDictionary();
            });
            document.getElementById('closeBtn').addEventListener('click', () => {
                window.electronAPI.tools.closeDictionary();
            });

            // Opacity slider
            document.getElementById('opacitySlider').addEventListener('input', (e) => {
                const opacity = e.target.value / 100;
                document.body.style.opacity = opacity;
                document.getElementById('opacityValue').textContent = `${e.target.value}%`;
            });
        }

        async function searchWord() {
            const word = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!word) return;

            const content = document.getElementById('dictionaryContent');
            content.innerHTML = '<div class="loading"><div class="loading-spinner"></div></div>';

            try {
                const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);

                if (!response.ok) {
                    throw new Error('Word not found');
                }

                const data = await response.json();
                displayDefinition(data[0]);
                addToHistory(word);
            } catch (error) {
                content.innerHTML = `
                    <div class="error-message">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="var(--danger-color)" style="margin-bottom: 16px;">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                        </svg>
                        <p>Word not found. Please check the spelling and try again.</p>
                    </div>
                `;
            }
        }

        function displayDefinition(data) {
            const content = document.getElementById('dictionaryContent');

            // Find audio URL
            let audioUrl = null;
            if (data.phonetics) {
                for (const phonetic of data.phonetics) {
                    if (phonetic.audio) {
                        audioUrl = phonetic.audio;
                        break;
                    }
                }
            }

            let html = `
                <div class="word-header">
                    <div class="word-title">${data.word}</div>
                    <div class="word-phonetic">
                        ${data.phonetic || (data.phonetics && data.phonetics[0]?.text) || ''}
                        ${audioUrl ? `
                            <button class="pronunciation-btn" onclick="playPronunciation('${audioUrl}')">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                                </svg>
                                Listen
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;

            // Meanings
            if (data.meanings) {
                data.meanings.forEach(meaning => {
                    html += `
                        <div class="meaning-section">
                            <div class="part-of-speech">${meaning.partOfSpeech}</div>
                    `;

                    // Definitions
                    meaning.definitions.slice(0, 5).forEach((def, index) => {
                        html += `
                            <div class="definition-item">
                                <div class="definition-text">${index + 1}. ${def.definition}</div>
                                ${def.example ? `<div class="definition-example">"${def.example}"</div>` : ''}
                            </div>
                        `;
                    });

                    // Synonyms
                    if (meaning.synonyms && meaning.synonyms.length > 0) {
                        html += `
                            <div class="synonyms-section">
                                <div class="synonyms-title">Synonyms:</div>
                                ${meaning.synonyms.slice(0, 6).map(s => `
                                    <span class="word-tag" onclick="lookupWord('${s}')">${s}</span>
                                `).join('')}
                            </div>
                        `;
                    }

                    // Antonyms
                    if (meaning.antonyms && meaning.antonyms.length > 0) {
                        html += `
                            <div class="antonyms-section">
                                <div class="antonyms-title">Antonyms:</div>
                                ${meaning.antonyms.slice(0, 6).map(a => `
                                    <span class="word-tag" onclick="lookupWord('${a}')">${a}</span>
                                `).join('')}
                            </div>
                        `;
                    }

                    html += '</div>';
                });
            }

            content.innerHTML = html;
        }

        function playPronunciation(url) {
            if (audioPlayer) {
                audioPlayer.pause();
            }
            audioPlayer = new Audio(url);
            audioPlayer.play();
        }

        function lookupWord(word) {
            document.getElementById('searchInput').value = word;
            searchWord();
        }

        function addToHistory(word) {
            if (!searchHistory.includes(word)) {
                searchHistory.unshift(word);
                if (searchHistory.length > 10) {
                    searchHistory.pop();
                }
                saveSearchHistory();
            }
        }

        function saveSearchHistory() {
            localStorage.setItem('dictionaryHistory', JSON.stringify(searchHistory));
        }

        function loadSearchHistory() {
            const saved = localStorage.getItem('dictionaryHistory');
            if (saved) {
                searchHistory = JSON.parse(saved);
                displaySearchHistory();
            }
        }

        function displaySearchHistory() {
            const container = document.getElementById('searchHistory');
            if (searchHistory.length === 0) return;

            container.innerHTML = `
                <div class="search-history-title">Recent searches:</div>
                <div class="history-tags">
                    ${searchHistory.map(word => `
                        <span class="word-tag" onclick="lookupWord('${word}')">${word}</span>
                    `).join('')}
                </div>
            `;
        }
    </script>
</body>
</html>
